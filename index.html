<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX CSS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap');
      
      :root {
        /* 
           Authentic Chinese Exam Font Stack 
           "Times New Roman" is FIRST to ensure all Latin/Numbers use it.
        */
        --font-song: "Times New Roman", "SimSun", "Songti SC", "STSong", "Noto Serif SC", serif;
        --font-hei: "SimHei", "Heiti SC", "DengXian", "Noto Sans SC", sans-serif;
        --font-math: "Times New Roman", serif;
      }

      body {
        background-color: #525659;
      }

      /* Utility classes for fonts */
      .font-song {
        font-family: var(--font-song);
      }
      
      .font-hei {
        font-family: var(--font-hei);
      }
      
      /* 
         Special Class for Section Intros and Bold Text.
         We use a text-shadow hack in print to ensure it looks bold.
      */
      .section-intro-bold {
        font-family: var(--font-song);
        font-weight: 700; /* Standard Bold */
      }
      
      /* LaTeX Font Adjustments */
      .katex {
        font-size: 1.15em; 
        font-family: "Times New Roman", serif !important;
      }

      /* Multiple Choice Option Layout Helper */
      .mcq-options {
        display: flex;
        flex-wrap: wrap;
        column-gap: 2rem;
        row-gap: 0.5rem;
      }

      /* 
        Global Text Justification 
        Crucial for the "neat block" look of exam papers.
      */
      p, li, .prose {
        text-align: justify;
        text-justify: inter-ideograph;
      }

      /* --- CRITICAL PRINT STYLES --- */
      @media print {
        @page {
          size: A4 portrait;
          margin: 20mm 20mm; /* Standard Exam Margins */
        }
        
        /* 1. Reset Height Constraints to allow Pagination */
        html, body, #root {
          height: auto !important;
          min-height: auto !important;
          overflow: visible !important;
          background: white !important;
        }

        /* 2. Hide UI Elements */
        .no-print {
          display: none !important;
        }

        /* 3. Main Container Override */
        .print-container {
          margin: 0 !important;
          padding: 0 !important; /* Margins handled by @page */
          border: none !important;
          box-shadow: none !important;
          width: 100% !important;
          max-width: 100% !important;
          
          /* CRITICAL: Use block layout to allow page breaks */
          display: block !important; 
          height: auto !important;
          min-height: auto !important;
          overflow: visible !important;
        }

        /* 4. Bold Font Hack for PDF Export */
        .section-intro-bold, strong, b {
          font-weight: bold !important;
          /* This shadow tricks the PDF renderer into thickening the strokes */
          text-shadow: 0.2px 0 0 currentColor, -0.1px 0 0 currentColor !important;
        }
        
        /* 5. Page Break Rules */
        h1, h2, h3, .section-intro-bold {
          page-break-after: avoid;
        }
        li {
          page-break-inside: avoid;
        }
        img {
          page-break-inside: avoid;
        }
        
        /* 6. Typography adjustments for print */
        p, li {
          font-size: 10.5pt !important; /* Standard 'Wuhao' size */
          line-height: 1.6 !important;
        }
      }
      
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
    </style>
    <script>
      // Polyfill for process.env
      if (typeof window !== 'undefined' && !window.process) {
        window.process = { env: { API_KEY: "" } };
      }
    </script>

{

    "remark-math": "https://aistudiocdn.com/remark-math@^6.0.0",

  }
}
</script>
</head>
